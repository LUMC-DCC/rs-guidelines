name: Check links

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC — link rot is gradual
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install '.[dev]'

      - name: Run tests
        run: pytest tests/ -q

      - name: Build site
        run: mkdocs build --strict

      # Keeps the generator-agnostic path (used for a future generator
      # migration) working, so it cannot rot unnoticed.
      - name: Check the pre-build path still runs
        run: python tools/prepare.py --out build/docs --strict

      - name: Check links in the built site
        uses: lycheeverse/lychee-action@v2
        with:
          # Check rendered HTML so token-expanded and generated links are covered.
          # Internal LUMC hosts are excluded via .lycheeignore (unreachable from CI).
          args: --no-progress --exclude-mail --accept 200,206,429 './site/**/*.html'
          fail: false  # report broken links without blocking; make required later if wanted
