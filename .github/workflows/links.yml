name: Check links

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC — link rot is gradual
  workflow_dispatch:

# Supersede an earlier run on the same branch rather than queueing behind it.
concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linkcheck:
    name: Build and check links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup

      # Also the PR gate on the build itself: a failure here fails the job.
      - name: Build site
        run: make build

      - name: Check links in the built site
        uses: lycheeverse/lychee-action@v2
        with:
          # Check rendered HTML so token-expanded and generated links are covered.
          # Internal LUMC hosts are excluded via .lycheeignore (unreachable from CI).
          args: --no-progress --exclude-mail --accept 200,206,429 './site/**/*.html'
          fail: false  # report broken links without blocking; make required later if wanted
