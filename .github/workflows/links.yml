name: Check links

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC — link rot is gradual
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'poetry'

      - name: Install dependencies
        run: poetry install --no-interaction

      # `make build` is the same sequence contributors run locally, so the
      # Makefile cannot drift from CI.
      - name: Build site
        run: make build

      - name: Check links in the built site
        uses: lycheeverse/lychee-action@v2
        with:
          # Check rendered HTML so token-expanded and generated links are covered.
          # Internal LUMC hosts are excluded via .lycheeignore (unreachable from CI).
          args: --no-progress --exclude-mail --accept 200,206,429 './site/**/*.html'
          fail: false  # report broken links without blocking; make required later if wanted
