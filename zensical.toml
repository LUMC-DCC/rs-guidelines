[project]
site_name = "Research Software Guidelines"
site_url = "https://lumc-dcc.github.io/rs-guidelines"
repo_url = "https://github.com/LUMC-DCC/rs-guidelines"
repo_name = "LUMC-DCC/rs-guidelines"
edit_uri = ""
copyright = 'Research Software Guidelines by LUMC DCC, licensed under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>'

# Generated by tools/prepare.py; never edit in place. Source lives in docs/.
docs_dir = "build/docs"

extra_css = ["stylesheets/extra.css"]

nav = [
  "index.md",
  { "What is research software?" = [
    "rs/definitions-examples.md",
    "rs/is-developing-rs.md",
  ] },
  { "Software Management Plans" = [
    "smp/smp-intro.md",
    "smp/sciwiz.md",
  ] },
  { "Research Software best practices" = [
    "best-practices/overview.md",
    "best-practices/identity.md",
    "best-practices/motivation-scope.md",
    "best-practices/risks.md",
    "best-practices/planning.md",
    "best-practices/sharing-licensing.md",
    "best-practices/metadata.md",
    "best-practices/documentation-community.md",
    "best-practices/interoperability.md",
    "best-practices/testing-quality.md",
    "best-practices/versioning-releases.md",
  ] },
  { "Resources" = [
    "resources/organizations.md",
    "resources/abbreviations.md",
    "resources/contacts.md",
  ] },
  "about.md",
]

[project.theme]
variant = "modern"
features = [
  # "navigation.sections",
  "navigation.top",
  "content.code.copy",
]
logo = "assets/lumc-monogram-blauw-png.png"

[project.theme.icon]
repo = "fontawesome/brands/github"

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
