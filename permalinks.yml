# Stable /go/<slug>/ URLs for linking into the guidelines (e.g., from the SMP).
#
# Link to https://lumc-dcc.github.io/rs-guidelines/go/<slug>/, never to the
# section directly. When a linked section's title changes or moves, update
# its `target` here. `mkdocs build --strict` fails if a target no longer resolves.
#
# `target` is a path under docs/, with an optional
# #anchor for a section, subsection, or sub-subsection.

- slug: two-maintainers
  target: best-practices/identity.md#why-a-project-needs-at-least-two-maintainers
- slug: testing
  target: best-practices/testing-quality.md
